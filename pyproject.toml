[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatbee"
version = "0.1.0"
description = "Deterministic Discogs Master list validation"
requires-python = ">=3.11"

[project.scripts]
beatbee = "beatbee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
